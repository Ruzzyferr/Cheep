# Sır taraması yapılandırması (gitleaks).
#
# NEDEN VAR: repo public'ken GitHub'ın ücretsiz secret scanning + push
# protection'ı açıktı. Repo private olunca bu ikisi ücretli GitHub Secret
# Protection'a bağlanıyor, yani kapanıyor. Yerine CI'da gitleaks koşuyor;
# amaç aynı: bir sır yanlışlıkla commit'lenirse main'e girmeden yakalansın.

[extend]
useDefault = true

# ---------------------------------------------------------------------------
# İZİN LİSTESİ
#
# Buradaki her madde bilinçli bir karar. "Gürültüyü sustur" diye değil,
# "bu değer TASARIM GEREĞİ istemcide" diye muaf. Üçü de uygulama paketinin
# içinde kullanıcının cihazına gidiyor; APK'yı açan herkes zaten görüyor.
# Repoda durmaları yeni bir maruziyet yaratmıyor.
#
# Buraya bir şey eklemeden önce sorulacak soru: bu değer sunucu tarafında bir
# şeyi açıyor mu? Açıyorsa muaf DEĞİL, döndürülmesi gerekir.
# ---------------------------------------------------------------------------
[[allowlists]]
description = "Firebase/Google istemci anahtarı — APK içinde taşınıyor, gizli değil. Kötüye kullanıma karşı korunma yolu gizlemek değil, Google Cloud Console'da kısıtlamak (paket adı + SHA-1 + yalnızca gereken API'ler)."
paths = ['''Cheep-Mobile/google-services\.json''']

[[allowlists]]
description = "RevenueCat GENEL SDK anahtarları (appl_/goog_). Belgelerinde istemciye gömülmek üzere tasarlandıkları yazılı. Gizli olan v1 REST anahtarı (sk_...) ayrı ve repoda yok."
regexes = [
    '''appl_[A-Za-z0-9]{20,}''',
    '''goog_[A-Za-z0-9]{20,}''',
]

[[allowlists]]
description = "Örnek/şablon dosyaları: gerçek değer değil, doldurulacak yer tutucu."
paths = [
    '''.*\.env\.example$''',
    '''.*\.env\.production\.example$''',
    '''Cheep-Scraper/ENV_SETUP\.md''',
]

# --- Aşağıdakiler CI'ın ilk koşusunda ÖLÇÜLDÜ, tahmin edilmedi. ---
# Hepsi kural bazında dar tutuldu: yalnızca gürültü üreten kural susturuldu.
# Komple dosya muafiyeti verilmiyor ki aynı dosyaya gerçek bir AWS/GCP
# anahtarı yapıştırılsa kendi kuralıyla yine yakalansın.

[[allowlists]]
description = "Scraper fixture'ları: Auchan/Żabka gibi sitelerden ÇEKİLMİŞ ham HTML/JSON. İçindeki sayfalama token'ları (nextPageToken UUID'leri) o sitelere ait, bize ait bir kimlik bilgisi değil."
targetRules = ["generic-api-key", "jwt"]
paths = ['''Cheep-Scraper/countries/[^/]+/fixtures/.*''']

[[allowlists]]
description = "Scraper testlerindeki uydurma sayfalama token'ları."
targetRules = ["generic-api-key"]
paths = ['''Cheep-Scraper/tests/.*\.py$''']

[[allowlists]]
description = "off_bulk.py'de bir DOCSTRING: fonksiyonun döndürdüğü istatistik alan adlarını sayıyor, değer değil."
targetRules = ["generic-api-key"]
regexes = ['''ambiguous_keys1, unique_keys2''']

[[allowlists]]
description = "Backend README'sindeki .env örneği — Türkçe yer tutucu metinler."
targetRules = ["generic-api-key"]
regexes = [
    '''en-az-32-karakterlik-gizli-deger''',
    '''scraper-icin-paylasilan-anahtar''',
]

[[allowlists]]
description = "Belgelerdeki yerel geliştirme veritabanı adresleri (postgres:postgres@localhost). Yalnızca geliştiricinin kendi makinesindeki docker kabına işaret ediyor."
regexes = [
    '''postgres(ql)?://postgres:postgres@(localhost|127\.0\.0\.1):\d+''',
    '''postgres(ql)?://(USER|user):(PASSWORD|password|pass)@localhost''',
]
