name: Mobil sürüm (test kanalları)

# main'e mobil bir değişiklik gittiğinde Android ve iOS derlenir, sürüm
# numarası mağazadan hesaplanır, notlar commit'lerden üretilir ve derlemeler
# TEST kanallarına yüklenir:
#   Android → Play "Closed testing" (alpha)
#   iOS     → TestFlight
#
# ÜRETİME OTOMATİK ÇIKMAZ. Testten mağazaya geçiş bilinçli bir insan kararı;
# `play-upload.mjs` production kanalını açıkça reddediyor.
#
# YOL FİLTRESİ ŞART: backend/website commit'i uygulama derlemesi gerektirmiyor.
# Filtre olmasaydı sunucu tarafındaki her düzeltme boşuna iki derleme tetikler,
# testçilere anlamsız bir TestFlight bildirimi giderdi.
on:
  push:
    branches: [main]
    paths:
      - 'Cheep-Mobile/**'
      - 'scripts/ci/**'
      - '.github/workflows/mobile-release.yml'
      # ÜRETİM SÜRÜM NOTU DERLEMEYİ TETİKLEMEZ.
      #
      # Bu dosyayı yalnızca `play-promote.mjs` okuyor ve o betik ELLE
      # çalıştırılıyor — içeriği hiçbir derlemeye girmiyor. `scripts/ci/**`
      # kalıbı içinde kaldığı için notu güncellemek koca bir mobil derleme
      # başlatıyordu; macOS koşucusu dakikayı 10 katıyla yazdığından bu,
      # hiçbir çıktısı olmayan en pahalı koşu oluyordu.
      - '!scripts/ci/release-notes-production.json'
      # Magaza vitrini ve onu ureten betikler DERLEMEYI TETIKLEMEZ.
      #
      # `Cheep-Mobile/**` cok genis: bir PNG eklemek ya da .gitignore'a
      # satir yazmak iOS+Android surum hattini bastan calistiriyordu.
      # Bugun bu iki kez oldu ve iki kosu da elle iptal edildi; macOS
      # kosucusu dakikayi 10 katiyla yaziyor, yani bu hatanin faturasi
      # dogrudan aylik CI butcesinden cikiyor.
      - '!Cheep-Mobile/appstore-screenshots*/**'
      - '!Cheep-Mobile/play-screenshots*/**'
      - '!Cheep-Mobile/*_shots.py'
      - '!Cheep-Mobile/.gitignore'
  workflow_dispatch:
    inputs:
      android_track:
        description: 'Play kanalı (production KABUL EDİLMEZ)'
        default: 'alpha'
        type: choice
        options: [alpha, internal, beta]

# cancel-in-progress KAPALI: yükleme ortasında iptal edilen bir koşu Play'de
# açık bir edit bırakabilir ve sonraki koşuyu düşürür.
concurrency:
  group: mobil-surum
  cancel-in-progress: false

env:
  ANDROID_TRACK: ${{ inputs.android_track || 'alpha' }}
  # Uygulamanın konuşacağı backend. SIR DEĞİL — zaten paketin içine gömülüyor,
  # o yüzden secret değil repo değişkeni: panelde görünür ve düzenlenebilir.
  #
  # ⚠️ BUNSUZ DERLEME SESSİZCE BOZUK ÇIKAR. `src/constants/api.ts` bu değişken
  # yoksa release build'de AÇILIŞTA hata fırlatıyor; ama derleme BAŞARILI
  # oluyor, yani hiçbir şey yakalamıyor ve testçilere açılmayan bir uygulama
  # gidiyor. EAS bu değeri kendi tarafında tutuyordu; hat EAS'ten çıkarken
  # geride kalmıştı. Aşağıdaki "ortam kapısı" adımı artık bunu derlemeden
  # ÖNCE durduruyor.
  EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
  # AdMob banner birim kimlikleri. SIR DEĞİL (istemcide zaten görünürler), o
  # yüzden secret değil repo değişkeni.
  #
  # ZORUNLU DEĞİL — tanımsızsa uygulama Google'ın TEST birimine düşer ve
  # çalışır, yalnızca gelir üretmez (bkz. Cheep-Mobile/src/config/ads.ts).
  # Derlemeyi burada durdurmuyoruz çünkü reklamsız bir derleme bozuk bir
  # derleme değil; API URL'sinin aksine uygulamayı açılışta çökertmez.
  #
  # PLATFORM BAŞINA AYRI: AdMob birimleri platforma özel. Android birimini
  # iOS'ta kullanmak reklam gelmemesi ve raporun karışması demek.
  EXPO_PUBLIC_ADMOB_BANNER_HOME_ANDROID: ${{ vars.EXPO_PUBLIC_ADMOB_BANNER_HOME_ANDROID }}
  EXPO_PUBLIC_ADMOB_BANNER_SEARCH_ANDROID: ${{ vars.EXPO_PUBLIC_ADMOB_BANNER_SEARCH_ANDROID }}
  EXPO_PUBLIC_ADMOB_BANNER_LIST_ANDROID: ${{ vars.EXPO_PUBLIC_ADMOB_BANNER_LIST_ANDROID }}
  EXPO_PUBLIC_ADMOB_BANNER_HOME_IOS: ${{ vars.EXPO_PUBLIC_ADMOB_BANNER_HOME_IOS }}
  EXPO_PUBLIC_ADMOB_BANNER_SEARCH_IOS: ${{ vars.EXPO_PUBLIC_ADMOB_BANNER_SEARCH_IOS }}
  EXPO_PUBLIC_ADMOB_BANNER_LIST_IOS: ${{ vars.EXPO_PUBLIC_ADMOB_BANNER_LIST_IOS }}

jobs:
  # ── CI KAPISI ───────────────────────────────────────────────────────────
  # Surum hatti CI'a BAGLI DEGILDI: ikisi de main'e push ile tetikleniyor ve
  # PARALEL kosuyordu. `Cheep-Mobile/**` altindaki bir commit tsc'yi ya da bir
  # testi kirdiginda, CI kirmiziya donerken AYNI ANDA imzali bir AAB Play kapali
  # testine ve bir IPA TestFlight'a gidiyordu. Testciler bozuk derlemeyi aliyor,
  # kirmizi CI e-postasi ARDINDAN geliyordu.
  #
  # Bu is CI'in mobil kapilarini (tsc + eslint + vitest) AYNEN tekrar kosuyor.
  # Neden `workflow_run` degil: o, hatti ayri bir olay zincirine tasiyip
  # `github.sha`yi degistirir ve surum notu araligi ile etiketleme mantigini
  # bastan yazmayi gerektirirdi. Birkac dakikalik tekrar, bozuk bir derlemenin
  # magazaya gitmesinden ucuz.
  ci_kapisi:
    name: CI kapısı (mobil)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Cheep-Mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Cheep-Mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint . --max-warnings 0
      - run: npx vitest run

  hazirlik:
    name: Sürüm numarası ve notlar
    runs-on: ubuntu-latest
    # `actions: read` ŞART. Repo varsayılanı olan "read" yalnızca contents,
    # packages ve metadata veriyor — Actions API'sini KAPSAMIYOR. Bu izin
    # olmadan release-notes.mjs koşu geçmişini okuyamıyor ve sessizce etiket
    # yedeğine düşüyordu; etiket de atılamadığı durumda notlar son 30 commit'e
    # kayardı.
    permissions:
      contents: read
      actions: read
    outputs:
      version_code: ${{ steps.ver.outputs.version_code }}
      build_number: ${{ steps.ver.outputs.build_number }}
      app_version: ${{ steps.app.outputs.app_version }}
      notes: ${{ steps.notes.outputs.notes }}
      kimlik_uyarisi: ${{ steps.kimlik.outputs.uyari }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # notlar için tüm geçmiş ve etiketler gerekli
      - uses: actions/setup-node@v7
        with: { node-version: 20 }

      - name: Uygulama sürümü (app.json)
        id: app
        run: |
          v=$(node -p "require('./Cheep-Mobile/app.json').expo.version")
          echo "app_version=$v" >> "$GITHUB_OUTPUT"
          echo "app.json sürümü: $v"

      - name: Sonraki numaraları mağazadan hesapla
        id: ver
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: node scripts/ci/next-version.mjs both

      - name: Apple imzalama kimlikleri ne zaman doluyor
        id: kimlik
        # Sertifika ve profil süreli; dolduğu gün iOS derlemesi kırılır ve o
        # ana kadar hiçbir şey uyarmaz. Yenileme elle yapılan bir iş, o yüzden
        # 45 gün önceden haber veriliyor. Bu adım derlemeyi ASLA düşürmez.
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: node scripts/ci/check-credentials.mjs

      - name: Sürüm notlarını üret
        id: notes
        env:
          # Not aralığını bir önceki BAŞARILI koşudan okumak için (etiket
          # yerine). Yalnızca okuma; varsayılan GITHUB_TOKEN izni zaten read.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/release-notes.mjs

      - name: Özet
        env:
          RELEASE_NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          {
            echo "### Mobil sürüm"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Sürüm | ${{ steps.app.outputs.app_version }} |"
            echo "| Android versionCode | ${{ steps.ver.outputs.version_code }} |"
            echo "| iOS build | ${{ steps.ver.outputs.build_number }} |"
            echo "| Play kanalı | $ANDROID_TRACK |"
            echo ""
            echo '```'
            # NOTLAR ENV ILE GELIR, ifade enterpolasyonuyla DEGIL.
            #
            # `steps.notes.outputs.notes` commit KONULARINDAN uretiliyor
            # (git log --pretty=%s) ve Actions onu kabuk ayristirmadan ONCE
            # satira gomuyordu. Ters tirnak ya da $( iceren bir Turkce commit
            # konusu -- "fix(mobil): fiyat $(bakiye) alani duzeltildi" -- kabukta
            # komut ikamesi calistiriyor; dengesiz tirnak ise sozdizimi hatasi
            # verip `hazirlik` isini dusuruyor, yani BIR COMMIT MESAJI yuzunden
            # hicbir derleme cikmiyordu. Kotu niyetli halde ise push yetkisi olan
            # herkes secret'larin bulundugu runner'da kod calistirabilirdi.
            # Dogru desen `bildirim` isinde zaten kullaniliyor: env uzerinden gec.
            echo "$RELEASE_NOTES"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  android:
    name: Android → Play ${{ inputs.android_track || 'alpha' }}
    # EN AZ YETKI. Bu is `npm ci`, `pod install`, `expo prebuild` gibi ucuncu
    # taraf yasam dongusu betikleri calistiriyor VE imzalama malzemesini
    # (ANDROID_KEYSTORE_B64 / IOS_DIST_CERT_B64) tasiyor. `permissions` blogu
    # olmayan bir is deponun VARSAYILAN GITHUB_TOKEN kapsamini miras aliyor;
    # ele gecirilmis bir bagimlilik o token'la depoya yazabilirdi. `hazirlik`
    # ve `etiket` isleri bunu zaten dogru yapiyordu, digerlerine uygulanmamisti.
    permissions:
      contents: read
    needs: [hazirlik, ci_kapisi]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Cheep-Mobile/package-lock.json
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '17' }

      - name: İmzalama kasasını secret'lardan kur
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # withReleaseSigning.js bu iki dosyayı $CHEEP_KEYSTORE_DIR altında arar.
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keys/cheep-upload.keystore"
          cat > "$RUNNER_TEMP/keys/signing.properties" <<EOF
          storeFile=cheep-upload.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "CHEEP_KEYSTORE_DIR=$RUNNER_TEMP/keys" >> "$GITHUB_ENV"

      - name: versionCode'u yaz
        working-directory: Cheep-Mobile
        run: |
          node -e "
            const fs=require('fs');
            const j=JSON.parse(fs.readFileSync('app.json','utf8'));
            j.expo.android.versionCode = ${{ needs.hazirlik.outputs.version_code }};
            fs.writeFileSync('app.json', JSON.stringify(j,null,2)+'\n');
            console.log('versionCode ->', j.expo.android.versionCode);
          "

      - name: Ortam kapısı — API adresi tanımlı mı
        run: |
          if [ -z "${EXPO_PUBLIC_API_URL:-}" ]; then
            echo "::error::EXPO_PUBLIC_API_URL tanımlı değil."
            echo "Bu değişken olmadan derleme BAŞARILI olur ama uygulama açılışta çöker."
            echo "Düzeltme: repo değişkenlerine EXPO_PUBLIC_API_URL ekleyin."
            exit 1
          fi
          echo "API adresi: $EXPO_PUBLIC_API_URL"

      - run: npm ci --no-audit --no-fund
        working-directory: Cheep-Mobile

      - name: AAB derle (R8 açık, imza kasadan)
        working-directory: Cheep-Mobile
        env:
          EXPO_NO_TELEMETRY: '1'
        run: node scripts/release-android.mjs

      - name: İmzayı bağımsız doğrula
        run: |
          AAB=Cheep-Mobile/android/app/build/outputs/bundle/release/app-release.aab
          # Derleme betiği de doğruluyor; burada bir kez daha bakılıyor çünkü
          # yanlış anahtarla imzalı bir AAB'yi Play saatler sonra reddediyor.
          keytool -printcert -jarfile "$AAB" | grep -E "Owner:|SHA256:"

      - name: Notları dosyaya yaz
        run: |
          cat > "$RUNNER_TEMP/notes.txt" <<'NOTES_EOF'
          ${{ needs.hazirlik.outputs.notes }}
          NOTES_EOF

      - name: Play test kanalına yükle
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          node scripts/ci/play-upload.mjs \
            Cheep-Mobile/android/app/build/outputs/bundle/release/app-release.aab \
            "$ANDROID_TRACK" \
            "${{ needs.hazirlik.outputs.version_code }} (${{ needs.hazirlik.outputs.app_version }})" \
            "$RUNNER_TEMP/notes.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: android-aab
          path: Cheep-Mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7

  ios:
    name: iOS → TestFlight
    # EN AZ YETKI. Bu is `npm ci`, `pod install`, `expo prebuild` gibi ucuncu
    # taraf yasam dongusu betikleri calistiriyor VE imzalama malzemesini
    # (ANDROID_KEYSTORE_B64 / IOS_DIST_CERT_B64) tasiyor. `permissions` blogu
    # olmayan bir is deponun VARSAYILAN GITHUB_TOKEN kapsamini miras aliyor;
    # ele gecirilmis bir bagimlilik o token'la depoya yazabilirdi. `hazirlik`
    # ve `etiket` isleri bunu zaten dogru yapiyordu, digerlerine uygulanmamisti.
    permissions:
      contents: read
    needs: [hazirlik, ci_kapisi]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Cheep-Mobile/package-lock.json

      - name: İmzalama kimliğini geçici keychain'e al
        env:
          CERT_B64: ${{ secrets.IOS_DIST_CERT_B64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_B64 }}
        run: |
          set -euo pipefail
          # GEÇİCİ keychain: runner tek kullanımlık ama yine de varsayılan
          # login keychain'i kirletmiyoruz; şifre de rastgele.
          KC="$RUNNER_TEMP/build.keychain"
          KC_PASS=$(openssl rand -base64 24)
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"

          echo "$CERT_B64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Bu satır olmadan codesign her imzada parola soruyor ve iş asılı kalıyor.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" >/dev/null
          # Geçici keychain'i ARAMA LİSTESİNE ekle; yoksa codesign kimliği bulamaz.
          # Mevcut listeyi koruyarak başa ekliyoruz.
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed 's/[" ]//g')
          rm -f "$RUNNER_TEMP/dist.p12"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_B64" | base64 -d > "$RUNNER_TEMP/profile.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" \
                 | plutil -extract UUID raw -o - -)
          NAME=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" \
                 | plutil -extract Name raw -o - -)
          cp "$RUNNER_TEMP/profile.mobileprovision" \
             "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "profil: $NAME ($UUID)"

          IDENT=$(security find-identity -v -p codesigning "$KC" | head -1)
          echo "imza kimliği: $IDENT"

      - name: buildNumber'ı yaz
        working-directory: Cheep-Mobile
        run: |
          node -e "
            const fs=require('fs');
            const j=JSON.parse(fs.readFileSync('app.json','utf8'));
            j.expo.ios.buildNumber = '${{ needs.hazirlik.outputs.build_number }}';
            fs.writeFileSync('app.json', JSON.stringify(j,null,2)+'\n');
            console.log('buildNumber ->', j.expo.ios.buildNumber);
          "

      - name: Ortam kapısı — API adresi tanımlı mı
        run: |
          if [ -z "${EXPO_PUBLIC_API_URL:-}" ]; then
            echo "::error::EXPO_PUBLIC_API_URL tanımlı değil."
            echo "Bu değişken olmadan derleme BAŞARILI olur ama uygulama açılışta çöker."
            echo "Düzeltme: repo değişkenlerine EXPO_PUBLIC_API_URL ekleyin."
            exit 1
          fi
          echo "API adresi: $EXPO_PUBLIC_API_URL"

      - run: npm ci --no-audit --no-fund
        working-directory: Cheep-Mobile

      - name: expo prebuild (ios)
        working-directory: Cheep-Mobile
        env:
          EXPO_NO_TELEMETRY: '1'
        run: npx expo prebuild --platform ios --no-install --clean

      - name: CocoaPods
        working-directory: Cheep-Mobile/ios
        run: pod install

      - name: Arşivle
        working-directory: Cheep-Mobile/ios
        run: |
          set -euo pipefail
          SCHEME=$(basename "$(ls -d *.xcworkspace)" .xcworkspace)
          echo "scheme: $SCHEME"
          # `-destination generic/platform=iOS`: arşiv için doğru olan bu;
          # `-sdk iphoneos` tek başına bazı kurulumlarda cihaz seçemiyor.
          # xcpretty KULLANILMIYOR — runner'da kurulu olduğu garanti değil ve
          # boru hattı xcodebuild'in çıkış kodunu yutup hatayı gizliyor.
          xcodebuild -workspace "$SCHEME.xcworkspace" -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Cheep.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=3HPYDLAP64 \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            archive

      - name: IPA çıkar
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>3HPYDLAP64</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict>
              <key>com.cheep.mobile</key><string>$PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Cheep.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export"
          ls -la "$RUNNER_TEMP/export"

      - name: TestFlight'a yükle
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          # altool anahtarı SABİT bir yolda arar; başka yere koymak sessizce
          # "no such key" hatası verdirir.
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          IPA=$(ls "$RUNNER_TEMP/export"/*.ipa | head -1)
          echo "yükleniyor: $(basename "$IPA")"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          rm -f ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 7

  etiket:
    name: Sürümü etiketle
    needs: [hazirlik, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Etiket at
        # Etiket artık YÜK TAŞIMIYOR: not aralığı bir önceki başarılı koşudan
        # okunuyor (release-notes.mjs). Burada yalnızca insan kolaylığı için
        # atılıyor — "build 21 hangi commit'ti" sorusuna cevap.
        #
        # Bu yüzden ENGELLENİRSE KOŞUYU DÜŞÜRMÜYOR. GITHUB_TOKEN,
        # `.github/workflows/**` değiştiren bir commit'e etiket atamıyor
        # ("refusing to allow a GitHub App to create or update workflow ...
        # without workflows permission") ve bu izin YAML'da verilebilecek bir
        # şey değil. Yani hattın kendisini güncellediğimiz her sürümde bu adım
        # engellenir. Bir kez koşuyu kırmıştı: iki mağazaya da build gitmişken
        # sonuç KIRMIZI göründü — insanı kırmızıyı ciddiye almamaya alıştıran
        # tam olarak budur.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: mobil/v${{ needs.hazirlik.outputs.app_version }}-${{ needs.hazirlik.outputs.version_code }}
          MESAJ: Android vc${{ needs.hazirlik.outputs.version_code }} · iOS build ${{ needs.hazirlik.outputs.build_number }}
        run: |
          set -uo pipefail
          OBJ=$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/tags" \
                  -f tag="$TAG" -f message="$MESAJ" \
                  -f object="$GITHUB_SHA" -f type=commit --jq '.sha' 2>/dev/null) || OBJ=""
          if [ -n "$OBJ" ] && gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
               -f ref="refs/tags/$TAG" -f sha="$OBJ" >/dev/null 2>&1; then
            echo "etiket atıldı: $TAG"
          else
            echo "::warning::Etiket '$TAG' atılamadı (bu commit iş akışı dosyası değiştiriyor olabilir)."
            echo "Sürüm etkilenmedi: derlemeler mağazalara yüklendi ve not aralığı koşu geçmişinden okunuyor."
          fi

  bildirim:
    name: Bildirim
    # EN AZ YETKI. Bu is `npm ci`, `pod install`, `expo prebuild` gibi ucuncu
    # taraf yasam dongusu betikleri calistiriyor VE imzalama malzemesini
    # (ANDROID_KEYSTORE_B64 / IOS_DIST_CERT_B64) tasiyor. `permissions` blogu
    # olmayan bir is deponun VARSAYILAN GITHUB_TOKEN kapsamini miras aliyor;
    # ele gecirilmis bir bagimlilik o token'la depoya yazabilirdi. `hazirlik`
    # ve `etiket` isleri bunu zaten dogru yapiyordu, digerlerine uygulanmamisti.
    permissions:
      contents: read
    # HER DURUMDA çalışır — asıl değeri başarısızlıkta. `needs` listesi tüm
    # işleri kapsıyor ki her birinin sonucu `needs.<is>.result` üzerinden
    # okunabilsin; `always()` olmadan bu iş de düşen işle birlikte atlanır ve
    # tam da haber vermesi gereken anda susardı.
    if: always()
    needs: [hazirlik, android, ios, etiket]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20 }

      - name: E-posta gönder
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_BASLIK: Cheep · mobil sürüm hattı
          # Çok satırlı değerler (notlar, commit mesajı) doğrudan ortam
          # değişkeni olarak veriliyor; kabuk içinde tırnak/kaçış derdi yok.
          NOTIFY_JOBS: |
            Sürüm numarası ve notlar|${{ needs.hazirlik.result }}
            Android → Play ${{ inputs.android_track || 'alpha' }}|${{ needs.android.result }}
            iOS → TestFlight|${{ needs.ios.result }}
            Sürümü etiketle|${{ needs.etiket.result }}
          NOTIFY_ANDROID: ${{ needs.android.result }}
          NOTIFY_IOS: ${{ needs.ios.result }}
          NOTIFY_VERSION: ${{ needs.hazirlik.outputs.app_version }}
          NOTIFY_VC: ${{ needs.hazirlik.outputs.version_code }}
          NOTIFY_BUILD: ${{ needs.hazirlik.outputs.build_number }}
          NOTIFY_TRACK: ${{ inputs.android_track || 'alpha' }}
          NOTIFY_NOTES: ${{ needs.hazirlik.outputs.notes }}
          NOTIFY_UYARI: ${{ needs.hazirlik.outputs.kimlik_uyarisi }}
          NOTIFY_SHA: ${{ github.sha }}
          NOTIFY_COMMIT_MSG: ${{ github.event.head_commit.message || '(elle tetiklendi)' }}
          NOTIFY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/ci/notify.mjs

