name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cheep-backend-express
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: cheep-backend-express/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm test

  mobile:
    name: Mobile (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Cheep-Mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Cheep-Mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  scraper:
    name: Scraper (syntax check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Cheep-Scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # browser_data ve sanal ortam hariç tüm .py dosyalarını derleyerek söz dizimini doğrula
      - run: |
          python -m compileall -q $(git ls-files '*.py')
