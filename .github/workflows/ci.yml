name: CI

on:
  push:
    branches: [main]
  pull_request:

# NEDEN BU KADAR İŞ VAR: bu dosya uzun süre yalnızca backend'i gerçekten
# koruyordu. Mobilin 76 testi ve scraper'ın 259 testi HİÇ koşmuyordu (mobilde
# sadece tsc, scraper'da sadece `compileall` söz dizimi kontrolü vardı) ve
# `cheep-website` için hiçbir iş yoktu — sitenin derlenmemesi ancak gecelik
# yayın işi düştüğünde fark edilirdi. Kırık bir scraper testi bu yüzden
# aylarca main'de kaldı.
jobs:
  backend:
    name: Backend (typecheck + tests)
    runs-on: ubuntu-latest
    # En az yetki: bu isler yalnizca kodu okuyup test kosuyor.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cheep-backend-express
    steps:
      - uses: actions/checkout@v7
      # Depodaki TEK üçüncü taraf eylem — bu yüzden etiketle değil SHA ile
      # sabit. `@v4` taşınabilir bir işaretçi: eylemin deposu ele geçirilse
      # saldırgan v4'ü kendi commit'ine kaydırır ve bir dahaki koşuda kendi
      # kodu bizim secret'larımızın olduğu runner'da çalışır. SHA taşınamaz.
      # Yükseltirken: SHA'yı değiştir, yorumdaki sürümü de güncelle.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: cheep-backend-express/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      # `lint` script'i vardı ama eslint KURULU DEĞİLDİ; komut çöküyordu ve
      # CI onu hiç çağırmadığı için backend'de fiilen lint yoktu.
      - run: pnpm lint
      - run: pnpm test

  mobile:
    name: Mobile (typecheck + lint + tests)
    runs-on: ubuntu-latest
    # En az yetki: bu isler yalnizca kodu okuyup test kosuyor.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Cheep-Mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Cheep-Mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # `expo lint` uyarıyla 0 döner; uyarı sayısı sıfıra indirildiği için
      # --max-warnings 0 ile geri tırmanması engelleniyor.
      - run: npx eslint . --max-warnings 0
      - run: npx vitest run
      # EXPO SDK SURUM SAPMASI KAPISI.
      #
      # Yerel modullerin (react-native, reanimated, screens, svg, worklets...)
      # surumunu Expo SDK sahiplenir; `bundledNativeModules.json` onlari
      # pinler. Bir paket SDK'nin ustune cikarsa autolinking ve prebuild
      # sablonlari sessizce uyusmaz hale gelir — hata DERLEME zamaninda,
      # cogu zaman da ancak cihazda ortaya cikar.
      #
      # 26 Agu 2026: Dependabot'un "kucuk guncellemeler" PR'i react-native'i
      # 0.81.5'ten 0.87.0'a cikardi. RN `0.x` yayinlandigi icin semver bunu
      # MINOR sayiyor ve "ana surumleri hariç tut" kurali yakalamiyordu.
      # dependabot.yml'a acik bir haric tutma listesi eklendi, ama o liste
      # ELLE tutuluyor; bu kontrol listeye guvenmeden sapmayi yakalar.
      - run: npx expo-doctor

  website:
    name: Website (typecheck + lint)
    runs-on: ubuntu-latest
    # En az yetki: bu isler yalnizca kodu okuyup test kosuyor.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cheep-website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 22 — üretim imajıyla AYNI (`cheep-website/Dockerfile`:
          # `FROM node:22-alpine`). `camera-controls` zaten node>=22 istiyor.
          node-version: 22
          cache: npm
          cache-dependency-path: cheep-website/package-lock.json
      # `npm ci` DEĞİL, bilerek. Üretim imajı da `npm install` kullanıyor ve
      # gerekçesi Dockerfile'da yazılı: Tailwind v4 (oxide) ve emnapi gibi
      # platforma özgü optional bağımlılıklar lockfile'a tek platformun
      # ikilileriyle yazılıyor, `npm ci` başka platformda "lock file out of
      # sync" ile düşüyor. CI'nın üretimden farklı kurulum yapması, CI'yı
      # yeşil ama üretimi kırık bırakabilecek bir fark üretirdi.
      - run: npm install --no-audit --no-fund
      # Tam `npm run build` prerender adımında canlı API'ye gidiyor; CI'da ağ
      # bağımlılığı testi kırılgan yapar. Tip kontrolü + lint, kırılmaların
      # ezici çoğunluğunu ağ olmadan yakalar.
      - run: npx tsc -b --noEmit
      - run: npm run lint

  scraper:
    name: Scraper (syntax + tests)
    runs-on: ubuntu-latest
    # En az yetki: bu isler yalnizca kodu okuyup test kosuyor.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Cheep-Scraper
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Cheep-Scraper/requirements.txt
      # browser_data ve sanal ortam hariç tüm .py dosyalarını derleyerek söz dizimini doğrula
      - run: |
          python -m compileall -q $(git ls-files '*.py')
      - run: pip install -r requirements.txt
      # 259 test; ağ gerektirmiyor (hepsi sahte veriyle çalışıyor).
      - run: python -m pytest tests -q

  guvenlik:
    name: Sır taraması
    runs-on: ubuntu-latest
    # En az yetki: bu isler yalnizca kodu okuyup test kosuyor.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # geçmişin tamamı taranacak

      - name: gitleaks kur
        # Resmi eylem yerine ikili dosya: eylem sürüm etiketine bağlı
        # (etiket taşınabilir), ayrıca kuruluşlarda lisans anahtarı istiyor.
        # Sürüm burada sabit — yükseltme bilinçli bir commit olsun.
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSLf -o /tmp/gl.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gl.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/
          gitleaks version

      - name: Geçmişi tara
        # --redact: bulunan sır CI kaydına DÜŞMESİN. Aksi hâlde sızıntıyı
        # bildiren rapor sızıntının ikinci bir kopyasını üretmiş olurdu.
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose

      - name: Yamasiz image-size acigini tetikleyen bicimler
        # GHSA-5p2g-fcmc-qvqq ve GHSA-w3rx-r6r6-pgpr: `image-size` paketinin
        # ICNS ve JXL/HEIF ayristiricilarinda sonsuz dongu. YUKARI AKISTA
        # YAMA YOK — 2.0.2 en son yayinlanan surum ve aciklama <= 2.0.2'yi
        # kapsiyor; ustelik metro paketleyicisi 1.2.1'e sabitliyor, yani
        # yukseltme secenegi de yok.
        #
        # Acik yalnizca paketleyici BU BICIMLERDEN birini ayristirdiginda
        # tetikleniyor. Depoda hicbiri yok ve varliklarimiz yalnizca PNG/SVG.
        # Bu adim o kosulu bir inanc olmaktan cikarip ZORUNLU kiliyor: boyle
        # bir dosya depoya girerse derleme durur ve karar bilincli olarak
        # yeniden verilir. Aksi hâlde birinin gelecekte .heic bir ikon
        # eklemesi, kimse fark etmeden aciklamayi tekrar canlandirirdi.
        run: |
          set -euo pipefail
          bulunan=$(git ls-files | grep -iE '\.(icns|jxl|heic|heif|avif)$' || true)
          if [ -n "$bulunan" ]; then
            echo "HATA: image-size'in yamasiz acigini tetikleyen bicim(ler) bulundu:" >&2
            echo "$bulunan" >&2
            echo "Bu dosyalari PNG/WebP'ye cevirin ya da acigi yeniden degerlendirin." >&2
            exit 1
          fi
          echo "Tetikleyici bicim yok — image-size acigi ulasilamaz durumda."

  bildirim:
    name: Bildirim (yalnızca kırıkta)
    # SADECE BAŞARISIZLIKTA ve SADECE main'de.
    #
    # Sürüm hattı başarıda da haber veriyor çünkü orada haber DEĞERLİ: bir
    # derleme mağazaya gitti. CI ise her push'ta koşuyor; her yeşilde e-posta
    # atmak kutuyu gürültüyle doldurur ve iki hafta içinde kimse okumaz —
    # yani asıl kırmızıyı da kaçırtır. PR'lar hariç: sonuç zaten PR sayfasında.
    if: failure() && github.event_name == 'push'
    needs: [backend, mobile, website, scraper, guvenlik]
    runs-on: ubuntu-latest
    # En az yetki: bu isler yalnizca kodu okuyup test kosuyor.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - name: E-posta gönder
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_BASLIK: Cheep · main CI
          NOTIFY_JOBS: |
            Backend|${{ needs.backend.result }}
            Mobil|${{ needs.mobile.result }}
            Website|${{ needs.website.result }}
            Scraper|${{ needs.scraper.result }}
            Sır taraması|${{ needs.guvenlik.result }}
          NOTIFY_SHA: ${{ github.sha }}
          NOTIFY_COMMIT_MSG: ${{ github.event.head_commit.message }}
          NOTIFY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/ci/notify.mjs
