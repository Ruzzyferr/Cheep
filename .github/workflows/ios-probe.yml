name: iOS yetenek yoklaması

# TEK AMAÇ: GitHub'ın macOS runner'ında iOS derlemesi için gereken araçların
# gerçekten bulunduğunu ÖLÇMEK. Hiçbir şey derlemez, imzalamaz, yayınlamaz.
#
# Neden var: EAS'in ücretsiz iOS build kotası aylık ve dolabiliyor. Depo public
# olduğu için GitHub Actions'ın macOS runner'ları ücretsiz ve sınırsız; bu
# yoklama, EAS'e alternatif bir derleme hattının kurulabilir olduğunu
# varsaymak yerine kanıtlamak için.
#
# Sadece elle tetiklenir — push'ta koşup CI'yı yavaşlatmasın.
on:
  workflow_dispatch:

jobs:
  probe:
    name: macOS runner yeteneği
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Donanım ve işletim sistemi
        run: |
          echo "== makine =="
          sw_vers
          uname -m
          sysctl -n hw.ncpu | sed 's/^/CPU çekirdek: /'
          df -h / | tail -1

      - name: Xcode ve iOS SDK
        run: |
          echo "== xcode =="
          xcodebuild -version
          xcode-select -p
          echo "== kurulu SDK'lar =="
          xcodebuild -showsdks | grep -i ios || echo "iOS SDK bulunamadı"

      - name: İmzalama ve paketleme araçları
        run: |
          for t in security codesign xcrun altool notarytool; do
            if command -v "$t" >/dev/null 2>&1; then echo "  VAR  $t"; else echo "  YOK  $t"; fi
          done
          echo "== fastlane =="
          (gem list fastlane 2>/dev/null | head -2) || echo "  fastlane kurulu değil (gerekirse kurulur)"

      - name: Node ve proje bağımlılıkları
        working-directory: Cheep-Mobile
        run: |
          node --version
          npm --version
          echo "== npm ci (gerçek kurulum, süreyi ölçmek için) =="
          time npm ci --no-audit --no-fund

      - name: expo prebuild (ios) — derlemeden, sadece proje üretimi
        working-directory: Cheep-Mobile
        env:
          EXPO_NO_TELEMETRY: '1'
        run: |
          # Gerçek derleme YOK: yalnızca ios/ klasörü üretilebiliyor mu?
          npx expo prebuild --platform ios --no-install --clean
          echo "== üretilen ios/ =="
          ls -la ios/
          test -d ios/Cheep.xcworkspace -o -d ios/*.xcworkspace && echo "  workspace üretildi" || echo "  workspace YOK"

      - name: CocoaPods
        working-directory: Cheep-Mobile/ios
        run: |
          pod --version
          echo "== pod install (bağımlılıklar gerçekten çözülüyor mu) =="
          time pod install --repo-update 2>&1 | tail -20

      - name: Özet
        run: echo "Yoklama bitti — yukarıdaki adımların hepsi yeşilse iOS derleme hattı bu runner'da kurulabilir."
