# Cheep — log rotasyonu
#
# NEDEN VAR: yedi systemd birimi de `StandardOutput=append:` ile DÜZ DOSYAYA
# yazıyor ve bu dosyaların hiçbirini kimse kırpmıyordu. Depoda `logrotate`
# yapılandırması hiç yoktu.
#
# Somut risk: `cheep-fetcher.service` `Type=simple` + `Restart=always` +
# `RestartSec=30` ile 7/24 çalışıyor. Bir çökme döngüsü (ör. disk dolduğunda
# raw JSON yazılamıyor) 30 saniyede bir traceback yazar; kimse kırpmadığı için
# log dosyası, zaten dolmakta olan diski daha hızlı doldurur. Yani log,
# doldurduğu diskin ürettiği hatayı kaydederek sorunu büyütür.
#
# Caddy kendi erişim loglarını kendisi rotasyona sokuyor (Caddyfile'daki
# roll_size/roll_keep) — buraya dahil değil.
#
# Kurulum: `bash deploy/install-logrotate.sh`

/var/log/cheep-watchdog.log
/var/log/cheep-price-drops.log
/var/log/cheep-site-build.log
/var/log/cheep-taxonomy.log
{
    weekly
    rotate 8
    # Boyut tabanlı emniyet: haftayı beklemeden 20 MB'ı geçerse döndür.
    # Çökme döngüsünde haftalık rotasyon çok geç kalır.
    maxsize 20M
    compress
    delaycompress
    missingok
    notifempty
    # `copytruncate` ŞART: birimler dosyayı AÇIK TUTUYOR. Klasik rotasyon
    # (rename + create) yeni dosyayı oluşturur ama süreç eski inode'a yazmaya
    # devam eder; log sessizce görünmez olur. copytruncate içeriği kopyalayıp
    # dosyayı yerinde sıfırlar, açık tanıtıcı çalışmaya devam eder.
    copytruncate
}

/opt/cheep/Cheep-Scraper/logs/*.log
/opt/cheep/backups/backup.log
{
    weekly
    rotate 8
    maxsize 20M
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
