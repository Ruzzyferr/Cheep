# Cheep — production compose (DigitalOcean droplet)
# Postgres + backend API. Kafka YOK (HTTP import). Veriler named volume'da kalıcı.
# Çalıştırma: deploy/ dizininde `docker compose -f docker-compose.prod.yml up -d --build`
# (compose, aynı dizindeki `.env` dosyasını hem değişken enterpolasyonu hem de backend
#  env_file için kullanır.)

# Docker json-file loglari da SINIRSIZDI: dort container'in stdout'u
# /var/lib/docker/containers altinda sinirsiz buyuyordu. Backend her istegi
# logluyor; 48 GB'lik diskte bu tek basina bir zaman bombasi.
# KONTEYNER SERTLESTIRME — patlama yaricapini daraltir.
#
# `no-new-privileges`: konteyner icindeki bir surec setuid ikilisi ile yetki
# YUKSELTEMEZ. Uygulama acigi bulan biri icin root'a tirmanma yolunu kapatir.
# `cap_drop: ALL`: Linux yeteneklerinin tamami dusuruluyor, her servise
# yalnizca GERCEKTEN gerekeni geri veriliyor (asagida tek tek gerekcesiyle).
x-sertlestirme: &sertlestirme
  security_opt:
    - no-new-privileges:true

x-logging: &varsayilan-log
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    # `15-alpine` (sabit 15.8 DEGIL): minor surumler Postgres'te geriye donuk
    # uyumlu ve yalnizca hata/guvenlik duzeltmesi icerir. Sabit pin yuzunden
    # 15.8'de kalmistik — 3 Eki 2026'da 15.19 vardi, yani 11 yama surumu
    # geride. Major atlamak (16/17) pg_upgrade ister, o AYRI bir is.
    image: postgres:15-alpine
    restart: always
    logging: *varsayilan-log
    <<: *sertlestirme
    cap_drop: [ALL]
    # Postgres acilista dosya sahipligini duzeltip `postgres` kullanicisina
    # dusuyor; bu bes yetenek olmadan BASLAYAMAZ.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # `pg_hba.conf`taki `trust` satirlari KALDIRILDI (artik scram-sha-256).
      # Konteyner ICINDEN calisan her psql/pg_dump artik parola istiyor:
      # backup-db.sh, restore-drill.sh ve nobetcinin veri-tazeligi sorgusu
      # toplam DOKUZ yerde `docker exec ... psql` cagiriyor. Dokuzunu tek tek
      # duzenlemek yerine parolayi ortam degiskeni olarak veriyoruz; libpq
      # otomatik okuyor. Yeni bir sir ifsa edilmiyor: POSTGRES_PASSWORD zaten
      # ayni konteynerin ortaminda.
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - cheep_pgdata:/var/lib/postgresql/data
    # Sadece backend container'ı erişsin — host'a/dışarı PORT AÇILMAZ.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ../cheep-backend-express
    restart: always
    logging: *varsayilan-log
    # Node 3000'de dinliyor (>1024), ayrica dosya sahipligi degistirmiyor —
    # hicbir yetenege ihtiyaci yok.
    <<: *sertlestirme
    cap_drop: [ALL]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    # Dışarı AÇILMIYOR. Caddy iç Docker ağından backend:3000'e ulaşıyor.
    #
    # Eskiden "3000:3000" ile host'a açıktı (geçiş dönemi için). Artık kapalı,
    # çünkü Express `trust proxy=1` ile X-Forwarded-For'a güveniyor: port dışarı
    # açık kalsaydı herkes Caddy'yi atlayıp sahte XFF ile rate limit kovasını
    # değiştirebilir (ve TLS'siz konuşabilirdi). Yayınlanan tüm mobil sürümler
    # zaten https://api.cheep.live kullanıyor; kapatmadan önce porta gerçek
    # trafik gelmediği doğrulandı.
    # SADECE LOOPBACK'e bağlı. `expose:` (yalnız Docker ağı) sunucudaki
    # scraper'ları kırıyordu: systemd servisleri (cheep-fetcher,
    # cheep-fetcher-pl) `CHEEP_API_URL=http://localhost:3000/api/v1` kullanıyor
    # ve container yeniden yaratıldığında TR ingest'i tamamen durdu — veri
    # çekiliyor ama yazılamıyordu, ~20 saat fark edilmedi.
    #
    # `127.0.0.1:` öneki güvenlik amacını korur: port yalnızca sunucunun
    # kendisinden erişilebilir, internetten DEĞİL. Yukarıdaki XFF/TLS gerekçesi
    # dışarıdan erişim içindi; loopback'te geçerli değil.
    ports:
      - "127.0.0.1:3000:3000"
    # Container'ı gerçekten istek karşılayana kadar "healthy" sayma.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # Tanıtım sitesi (cheep.live) — Vite SPA build'i, kendi Caddy'siyle iç ağda :80'de servis edilir.
  website:
    build:
      context: ../cheep-website
    restart: always
    logging: *varsayilan-log
    <<: *sertlestirme
    cap_drop: [ALL]
    # Ic agda :80 dinliyor; 1024 altindaki porta baglanmak bu yetenegi ister.
    cap_add: [NET_BIND_SERVICE]
    expose:
      - "80"

  # Edge Caddy — tek TLS/Let's Encrypt noktası.
  #   cheep.live       → website:80 (SPA)
  #   api.cheep.live   → backend:3000 (API)
  caddy:
    image: caddy:2-alpine
    restart: always
    logging: *varsayilan-log
    <<: *sertlestirme
    cap_drop: [ALL]
    # 80 ve 443'e baglanmak icin; TLS sertifikasi yazmak icin yetenek gerekmez
    # (volume'lar zaten yazilabilir).
    cap_add: [NET_BIND_SERVICE]
    depends_on:
      - backend
      - website
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # App Review varliklari (inceleme videosu) — depoya girmez, sunucuda durur.
      - ./review-assets:/srv/review:ro
      - caddy_data:/data
      # Erişim logları: tarayıcı trafiğini (Googlebot dahil) görebilmek için.
      - caddy_logs:/var/log/caddy
      - caddy_config:/config

volumes:
  caddy_logs:
  cheep_pgdata:
  caddy_data:
  caddy_config:
