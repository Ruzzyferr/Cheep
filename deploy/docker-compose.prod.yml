# Cheep — production compose (DigitalOcean droplet)
# Postgres + backend API. Kafka YOK (HTTP import). Veriler named volume'da kalıcı.
# Çalıştırma: deploy/ dizininde `docker compose -f docker-compose.prod.yml up -d --build`
# (compose, aynı dizindeki `.env` dosyasını hem değişken enterpolasyonu hem de backend
#  env_file için kullanır.)

services:
  db:
    image: postgres:15.8-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - cheep_pgdata:/var/lib/postgresql/data
    # Sadece backend container'ı erişsin — host'a/dışarı PORT AÇILMAZ.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ../cheep-backend-express
    restart: always
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    # 3000 host'a açık kalır: eski (HTTP) APK'lar kırılmasın diye geçiş döneminde.
    # HTTPS geçişi tamamen oturunca kapatılabilir (Caddy zaten backend:3000'e iç ağdan erişir).
    ports:
      - "3000:3000"

  # Tanıtım sitesi (cheep.live) — Vite SPA build'i, kendi Caddy'siyle iç ağda :80'de servis edilir.
  website:
    build:
      context: ../cheep-website
    restart: always
    expose:
      - "80"

  # Edge Caddy — tek TLS/Let's Encrypt noktası.
  #   cheep.live       → website:80 (SPA)
  #   api.cheep.live   → backend:3000 (API)
  caddy:
    image: caddy:2-alpine
    restart: always
    depends_on:
      - backend
      - website
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  cheep_pgdata:
  caddy_data:
  caddy_config:
