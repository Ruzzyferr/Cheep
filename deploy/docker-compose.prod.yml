# Cheep — production compose (DigitalOcean droplet)
# Postgres + backend API. Kafka YOK (HTTP import). Veriler named volume'da kalıcı.
# Çalıştırma: deploy/ dizininde `docker compose -f docker-compose.prod.yml up -d --build`
# (compose, aynı dizindeki `.env` dosyasını hem değişken enterpolasyonu hem de backend
#  env_file için kullanır.)

services:
  db:
    image: postgres:15.8-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - cheep_pgdata:/var/lib/postgresql/data
    # Sadece backend container'ı erişsin — host'a/dışarı PORT AÇILMAZ.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ../cheep-backend-express
    restart: always
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    # Dışarı AÇILMIYOR. Caddy iç Docker ağından backend:3000'e ulaşıyor.
    #
    # Eskiden "3000:3000" ile host'a açıktı (geçiş dönemi için). Artık kapalı,
    # çünkü Express `trust proxy=1` ile X-Forwarded-For'a güveniyor: port dışarı
    # açık kalsaydı herkes Caddy'yi atlayıp sahte XFF ile rate limit kovasını
    # değiştirebilir (ve TLS'siz konuşabilirdi). Yayınlanan tüm mobil sürümler
    # zaten https://api.cheep.live kullanıyor; kapatmadan önce porta gerçek
    # trafik gelmediği doğrulandı.
    # SADECE LOOPBACK'e bağlı. `expose:` (yalnız Docker ağı) sunucudaki
    # scraper'ları kırıyordu: systemd servisleri (cheep-fetcher,
    # cheep-fetcher-pl) `CHEEP_API_URL=http://localhost:3000/api/v1` kullanıyor
    # ve container yeniden yaratıldığında TR ingest'i tamamen durdu — veri
    # çekiliyor ama yazılamıyordu, ~20 saat fark edilmedi.
    #
    # `127.0.0.1:` öneki güvenlik amacını korur: port yalnızca sunucunun
    # kendisinden erişilebilir, internetten DEĞİL. Yukarıdaki XFF/TLS gerekçesi
    # dışarıdan erişim içindi; loopback'te geçerli değil.
    ports:
      - "127.0.0.1:3000:3000"
    # Container'ı gerçekten istek karşılayana kadar "healthy" sayma.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # Tanıtım sitesi (cheep.live) — Vite SPA build'i, kendi Caddy'siyle iç ağda :80'de servis edilir.
  website:
    build:
      context: ../cheep-website
    restart: always
    expose:
      - "80"

  # Edge Caddy — tek TLS/Let's Encrypt noktası.
  #   cheep.live       → website:80 (SPA)
  #   api.cheep.live   → backend:3000 (API)
  caddy:
    image: caddy:2-alpine
    restart: always
    depends_on:
      - backend
      - website
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      # Erişim logları: tarayıcı trafiğini (Googlebot dahil) görebilmek için.
      - caddy_logs:/var/log/caddy
      - caddy_config:/config

volumes:
  caddy_logs:
  cheep_pgdata:
  caddy_data:
  caddy_config:
